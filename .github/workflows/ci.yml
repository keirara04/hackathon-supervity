name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: packages/requirements.txt

      - name: Install dependencies
        run: pip install -r packages/requirements.txt

      - name: Lint (flake8)
        run: flake8 app utils --max-line-length=120 --extend-ignore=E203,W503

      - name: Check formatting (black)
        run: black --check app utils

      - name: Test (pytest)
        env:
          APP_ENV: test
          AUTH_BYPASS: "true"
          DATABASE_URL: sqlite:///./test.db
        run: pytest tests -v

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
          NEXTAUTH_URL: http://localhost:3001
          NEXTAUTH_SECRET: ci-placeholder-secret-not-for-prod
        run: npm run build

  docker-build:
    name: Docker build sanity check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t backend:ci -f Dockerfile .

      - name: Build frontend image
        run: |
          docker build -t frontend:ci -f frontend/Dockerfile \
            --target prod \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8001 \
            --build-arg NEXTAUTH_URL=http://localhost:3001 \
            --build-arg NEXTAUTH_SECRET=ci-placeholder-secret-not-for-prod \
            frontend

  deploy:
    name: Deploy to production (Dokploy)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger backend deploy webhook
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_BACKEND_WEBHOOK }}"

      - name: Trigger frontend deploy webhook
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_FRONTEND_WEBHOOK }}"
